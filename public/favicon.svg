<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Hexagon Background -->
  <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="#040714" stroke="url(#dkGlow)" stroke-width="3" filter="url(#neonBlur)" />
  <!-- Inner Glow Lines -->
  <polygon points="50,14 84,33 84,67 50,86 16,67 16,33" fill="none" stroke="rgba(0,240,255,0.2)" stroke-width="1" />
  <!-- Monogram DK -->
  <text x="50" y="62" font-family="'Space Grotesk', 'Outfit', sans-serif" font-weight="900" font-size="34" fill="url(#dkGlow)" text-anchor="middle" letter-spacing="1">DK</text>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="1" stroke-dasharray="4,6" />
</svg>
