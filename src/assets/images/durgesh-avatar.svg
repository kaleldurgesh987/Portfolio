<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#111836" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEAA88" />
      <stop offset="100%" stop-color="#C58B68" />
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Circle with Hexagon Border -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="rgba(0,240,255,0.2)" stroke-width="2" />
  
  <!-- Outer Rotating Track -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="url(#cyberNeon)" stroke-width="2.5" stroke-dasharray="16 12 30 10" filter="url(#cyberGlow)" opacity="0.8" />
  
  <!-- Geometric Decorative Tech Circles -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(168,85,247,0.25)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(0,240,255,0.15)" stroke-width="1" />

  <!-- Corner Tech Accents -->
  <path d="M 120 70 L 80 70 L 80 110" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />
  <path d="M 380 70 L 420 70 L 420 110" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.8" />
  <path d="M 120 430 L 80 430 L 80 390" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.8" />
  <path d="M 380 430 L 420 430 L 420 390" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />

  <!-- Digital Code Matrix Particles in Background -->
  <text x="140" y="160" fill="rgba(0,240,255,0.3)" font-family="'JetBrains Mono', monospace" font-size="11">&lt;code&gt;</text>
  <text x="320" y="180" fill="rgba(168,85,247,0.35)" font-family="'JetBrains Mono', monospace" font-size="11">01000100</text>
  <text x="130" y="340" fill="rgba(0,240,255,0.25)" font-family="'JetBrains Mono', monospace" font-size="10">async/await</text>
  <text x="315" y="335" fill="rgba(168,85,247,0.3)" font-family="'JetBrains Mono', monospace" font-size="10">Unity.run()</text>

  <!-- Developer Silhouette / Character Body -->
  <!-- Shoulders & Cyber Hoodie -->
  <path d="M 110 470 C 120 390, 170 350, 250 350 C 330 350, 380 390, 390 470 Z" fill="#0D162B" stroke="rgba(0,240,255,0.3)" stroke-width="2" />
  
  <!-- Hoodie Collar Details with Neon Piping -->
  <path d="M 185 355 L 250 420 L 315 355" fill="none" stroke="url(#cyberNeon)" stroke-width="3.5" filter="url(#cyberGlow)" />
  <path d="M 235 420 L 235 470" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
  <path d="M 265 420 L 265 470" stroke="#A855F7" stroke-width="2" opacity="0.6" />

  <!-- Neck -->
  <rect x="225" y="295" width="50" height="65" rx="10" fill="url(#skinGrad)" />

  <!-- Head Base -->
  <ellipse cx="250" cy="245" rx="72" ry="85" fill="url(#skinGrad)" />

  <!-- Modern Styled Hair -->
  <path d="M 172 235 C 168 185, 200 150, 250 145 C 300 145, 335 180, 328 235 C 315 220, 290 220, 275 225 C 260 215, 230 215, 215 225 C 200 220, 185 225, 172 235 Z" fill="#181824" />
  <!-- Hair Highlights -->
  <path d="M 190 175 Q 250 155 305 180" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.7" filter="url(#cyberGlow)" />
  <path d="M 210 162 Q 250 150 285 168" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8" filter="url(#cyberGlow)" />

  <!-- Ears -->
  <ellipse cx="176" cy="248" rx="12" ry="18" fill="#C58B68" />
  <ellipse cx="324" cy="248" rx="12" ry="18" fill="#C58B68" />

  <!-- Cybernetic Headset / Audio Interface -->
  <path d="M 166 235 C 160 210, 175 190, 175 190" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" filter="url(#cyberGlow)" />
  <rect x="160" y="235" width="14" height="26" rx="6" fill="#040714" stroke="#00F0FF" stroke-width="2" />
  <rect x="326" y="235" width="14" height="26" rx="6" fill="#040714" stroke="#A855F7" stroke-width="2" />
  <circle cx="167" cy="248" r="3" fill="#00F0FF" />
  <circle cx="333" cy="248" r="3" fill="#A855F7" />

  <!-- Futuristic Cyber Glasses / HUD Visor -->
  <g filter="url(#cyberGlow)">
    <!-- Visor Lens Body -->
    <path d="M 190 230 L 310 230 C 322 230, 325 240, 320 252 L 305 264 C 295 272, 280 270, 270 262 L 250 255 L 230 262 C 220 270, 205 272, 195 264 L 180 252 C 175 240, 178 230, 190 230 Z" fill="rgba(0, 240, 255, 0.25)" stroke="#00F0FF" stroke-width="2.5" />
    
    <!-- Visor Glowing Gradient Strip -->
    <line x1="192" y1="237" x2="308" y2="237" stroke="#A855F7" stroke-width="3" opacity="0.9" />
    
    <!-- HUD Target Reticle Inside Visor -->
    <circle cx="225" cy="248" r="7" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="275" cy="248" r="7" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="220" y1="248" x2="230" y2="248" stroke="#00F0FF" stroke-width="1.5" />
    <line x1="270" y1="248" x2="280" y2="248" stroke="#00F0FF" stroke-width="1.5" />
  </g>

  <!-- Nose -->
  <path d="M 248 266 L 244 282 L 253 283" fill="none" stroke="#B07856" stroke-width="2.5" stroke-linecap="round" />

  <!-- Confident Smile -->
  <path d="M 232 302 Q 250 312 268 302" fill="none" stroke="#8E4830" stroke-width="3" stroke-linecap="round" />

  <!-- Holographic Floating Badge: "DK // DEV" -->
  <g transform="translate(185, 420)" filter="url(#cyberGlow)">
    <rect x="0" y="0" width="130" height="34" rx="8" fill="#040714" stroke="url(#cyberNeon)" stroke-width="2" />
    <circle cx="16" cy="17" r="4.5" fill="#00F0FF" filter="url(#intenseGlow)" />
    <text x="32" y="22" font-family="'Space Grotesk', 'Outfit', sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" letter-spacing="1.5">DURGESH.DEV</text>
  </g>

  <!-- Floating Tech Data Nodes -->
  <g filter="url(#cyberGlow)">
    <circle cx="105" cy="205" r="5" fill="#00F0FF" />
    <line x1="105" y1="205" x2="145" y2="225" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 3" />

    <circle cx="395" cy="210" r="5" fill="#A855F7" />
    <line x1="395" y1="210" x2="355" y2="230" stroke="#A855F7" stroke-width="1" stroke-dasharray="3 3" />
  </g>
</svg>
