<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F1329" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#scBg)" />

  <!-- Background Code / Cyber Elements -->
  <g opacity="0.12" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Central Authentication Glass Card -->
  <g transform="translate(210, 45)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="380" height="410" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="url(#cyberGradient)" stroke-width="2" filter="url(#softGlow)" />
    
    <!-- Top Cyber Accent Bar -->
    <rect x="140" y="0" width="100" height="4" rx="2" fill="#00F0FF" filter="url(#softGlow)" />

    <!-- Brand Emblem -->
    <g transform="translate(190, 48)">
      <polygon points="0,-22 20,-10 20,14 0,26 -20,14 -20,-10" fill="#0A0E1A" stroke="#00F0FF" stroke-width="2" />
      <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="18" fill="#A855F7" text-anchor="middle">SX</text>
    </g>

    <!-- Header Titles -->
    <text x="190" y="105" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" text-anchor="middle">SHADOWX CODERS</text>
    <text x="190" y="126" font-family="'Outfit', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Secure Developer Portal &amp; Authentication</text>

    <!-- Google Sign-In Button -->
    <g transform="translate(45, 145)">
      <rect x="0" y="0" width="290" height="38" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <!-- Google 'G' icon -->
      <circle cx="24" cy="19" r="10" fill="#FFFFFF" />
      <text x="24" y="24" font-family="sans-serif" font-weight="bold" font-size="12" fill="#EA4335" text-anchor="middle">G</text>
      <text x="50" y="24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Continue with Google Account</text>
    </g>

    <!-- Divider Line -->
    <g transform="translate(45, 202)">
      <line x1="0" y1="0" x2="110" y2="0" stroke="rgba(255,255,255,0.15)" />
      <text x="145" y="4" font-family="'Outfit', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">OR WITH EMAIL</text>
      <line x1="180" y1="0" x2="290" y2="0" stroke="rgba(255,255,255,0.15)" />
    </g>

    <!-- Email Field -->
    <g transform="translate(45, 222)">
      <rect x="0" y="0" width="290" height="40" rx="8" fill="#0B132B" stroke="rgba(0,240,255,0.4)" stroke-width="1.2" />
      <text x="14" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">developer@shadowx.io</text>
      <circle cx="270" cy="20" r="5" fill="#10B981" />
    </g>

    <!-- Password Field -->
    <g transform="translate(45, 274)">
      <rect x="0" y="0" width="290" height="40" rx="8" fill="#0B132B" stroke="rgba(168,85,247,0.3)" stroke-width="1.2" />
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="14" fill="#A855F7">••••••••••••••</text>
      <text x="265" y="25" font-size="13">👁️</text>
    </g>

    <!-- Sign In CTA Button -->
    <g transform="translate(45, 332)">
      <rect x="0" y="0" width="290" height="42" rx="8" fill="url(#cyberGradient)" />
      <text x="145" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AUTHENTICATE &amp; ENTER</text>
    </g>

    <text x="190" y="394" font-family="'Outfit', sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Protected by Firebase Auth 256-bit encryption</text>
  </g>

  <!-- Left Side Cyber Badge -->
  <g transform="translate(35, 180)" filter="url(#softGlow)">
    <rect x="0" y="0" width="145" height="110" rx="12" fill="#0B1329" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" />
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#00F0FF">SECURE TOKENS</text>
    <text x="20" y="55" font-family="'Outfit', sans-serif" font-size="10" fill="#94A3B8">Automated OAuth</text>
    <text x="20" y="70" font-family="'Outfit', sans-serif" font-size="10" fill="#94A3B8">Session refresh</text>
    <text x="20" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">✓ JWT Verified</text>
  </g>

  <!-- Right Side Cyber Badge -->
  <g transform="translate(620, 180)" filter="url(#softGlow)">
    <rect x="0" y="0" width="145" height="110" rx="12" fill="#0B1329" stroke="rgba(168,85,247,0.3)" stroke-width="1.5" />
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#A855F7">MODERN STACK</text>
    <text x="20" y="55" font-family="'Outfit', sans-serif" font-size="10" fill="#94A3B8">HTML5 &amp; CSS3</text>
    <text x="20" y="70" font-family="'Outfit', sans-serif" font-size="10" fill="#94A3B8">Modular JavaScript</text>
    <text x="20" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">✓ Firebase Ready</text>
  </g>
</svg>
