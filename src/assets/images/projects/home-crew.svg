<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1F" />
      <stop offset="50%" stop-color="#0A1835" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#hcBg)" />

  <!-- Background Geolocation Radar Waves -->
  <g opacity="0.15">
    <circle cx="580" cy="250" r="120" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="580" cy="250" r="180" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="580" cy="250" r="240" fill="none" stroke="#00F0FF" stroke-width="1" />
  </g>

  <!-- Left Side: Android Device Frame (Jetpack Compose View) -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <!-- Phone Outer Body -->
    <rect x="0" y="0" width="240" height="420" rx="28" fill="#0B132B" stroke="rgba(0,240,255,0.4)" stroke-width="2" />
    
    <!-- Phone Screen -->
    <rect x="8" y="8" width="224" height="404" rx="20" fill="#060C1B" />
    
    <!-- Camera Punch Hole -->
    <circle cx="120" cy="22" r="4.5" fill="#1C274C" />

    <!-- App Header -->
    <rect x="18" y="38" width="204" height="40" rx="10" fill="#0E1A38" />
    <text x="32" y="63" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#00F0FF">Home Crew</text>
    <circle cx="198" cy="58" r="10" fill="#1E293B" />
    <circle cx="198" cy="58" r="4" fill="#10B981" />

    <!-- Search Bar -->
    <rect x="18" y="88" width="204" height="28" rx="6" fill="#111C3A" stroke="rgba(147,197,253,0.2)" stroke-width="1" />
    <text x="28" y="106" font-family="'Outfit', sans-serif" font-size="10" fill="#94A3B8">🔍 Search electrician, plumber...</text>

    <!-- Categories Grid inside Compose -->
    <g transform="translate(18, 126)">
      <!-- Cat 1 -->
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1" />
      <text x="23" y="27" font-size="16" text-anchor="middle">⚡</text>
      <!-- Cat 2 -->
      <rect x="52" y="0" width="46" height="46" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1" />
      <text x="75" y="27" font-size="16" text-anchor="middle">🔧</text>
      <!-- Cat 3 -->
      <rect x="105" y="0" width="46" height="46" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1" />
      <text x="128" y="27" font-size="16" text-anchor="middle">🪚</text>
      <!-- Cat 4 -->
      <rect x="158" y="0" width="46" height="46" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1" />
      <text x="181" y="27" font-size="16" text-anchor="middle">🧹</text>
    </g>

    <!-- Provider Card 1 in list -->
    <g transform="translate(18, 186)">
      <rect x="0" y="0" width="204" height="66" rx="10" fill="#0F172A" stroke="rgba(0,240,255,0.3)" stroke-width="1" />
      <circle cx="26" cy="33" r="16" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5" />
      <text x="26" y="38" font-size="12" text-anchor="middle">👷</text>
      <text x="50" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#F1F5F9">Rajesh Sharma</text>
      <text x="50" y="40" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8">Electrician • 0.8 km</text>
      <text x="50" y="54" font-family="'Outfit', sans-serif" font-size="9" fill="#FACC15">★ 4.9 (124 reviews)</text>
      <rect x="150" y="34" width="46" height="22" rx="5" fill="#3B82F6" />
      <text x="173" y="49" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF" text-anchor="middle">Book</text>
    </g>

    <!-- Provider Card 2 in list -->
    <g transform="translate(18, 260)">
      <rect x="0" y="0" width="204" height="66" rx="10" fill="#0F172A" stroke="rgba(147,197,253,0.15)" stroke-width="1" />
      <circle cx="26" cy="33" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <text x="26" y="38" font-size="12" text-anchor="middle">🛠️</text>
      <text x="50" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#F1F5F9">Amit Patil</text>
      <text x="50" y="40" font-family="'Outfit', sans-serif" font-size="9" fill="#94A3B8">Plumbing Specialist • 1.4 km</text>
      <text x="50" y="54" font-family="'Outfit', sans-serif" font-size="9" fill="#FACC15">★ 4.8 (98 reviews)</text>
      <rect x="150" y="34" width="46" height="22" rx="5" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
      <text x="173" y="49" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#00F0FF" text-anchor="middle">Book</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <rect x="8" y="365" width="224" height="47" rx="10" fill="#0A1124" />
    <text x="35" y="394" font-size="14">🏠</text>
    <text x="80" y="394" font-size="14">📋</text>
    <text x="125" y="394" font-size="14">💬</text>
    <text x="170" y="394" font-size="14">👤</text>
  </g>

  <!-- Right Side: High-Tech Architecture Feature Callouts -->
  <g transform="translate(350, 60)">
    <!-- Tagline Banner -->
    <text x="0" y="30" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">HOME CREW</text>
    <text x="0" y="60" font-family="'Outfit', sans-serif" font-style="italic" font-size="16" fill="#00F0FF">"Your home. Our helping hands."</text>

    <!-- Feature Card 1 -->
    <g transform="translate(0, 95)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="390" height="66" rx="12" fill="#0F172A" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" />
      <circle cx="36" cy="33" r="18" fill="rgba(0,240,255,0.15)" />
      <text x="36" y="40" font-size="16" text-anchor="middle">📍</text>
      <text x="70" y="28" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#00F0FF">Nearby Service Professionals</text>
      <text x="70" y="48" font-family="'Outfit', sans-serif" font-size="12" fill="#94A3B8">Real-time geolocation matching with verified local providers.</text>
    </g>

    <!-- Feature Card 2 -->
    <g transform="translate(0, 175)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="390" height="66" rx="12" fill="#0F172A" stroke="rgba(168,85,247,0.3)" stroke-width="1.5" />
      <circle cx="36" cy="33" r="18" fill="rgba(168,85,247,0.15)" />
      <text x="36" y="40" font-size="16" text-anchor="middle">⚡</text>
      <text x="70" y="28" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#A855F7">Kotlin &amp; Jetpack Compose</text>
      <text x="70" y="48" font-family="'Outfit', sans-serif" font-size="12" fill="#94A3B8">Declarative reactive UI with smooth micro-animations.</text>
    </g>

    <!-- Feature Card 3 -->
    <g transform="translate(0, 255)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="390" height="66" rx="12" fill="#0F172A" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" />
      <circle cx="36" cy="33" r="18" fill="rgba(245,158,11,0.15)" />
      <text x="36" y="40" font-size="16" text-anchor="middle">🔥</text>
      <text x="70" y="28" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#F59E0B">Firebase Live Firestore Backend</text>
      <text x="70" y="48" font-family="'Outfit', sans-serif" font-size="12" fill="#94A3B8">Live booking states, customer reviews &amp; worker accounts.</text>
    </g>

    <!-- Architecture Pill Badges -->
    <g transform="translate(0, 345)">
      <rect x="0" y="0" width="115" height="30" rx="6" fill="#172554" stroke="#3B82F6" stroke-width="1" />
      <text x="57" y="20" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#93C5FD" text-anchor="middle">KOTLIN / MVVM</text>

      <rect x="125" y="0" width="130" height="30" rx="6" fill="#172554" stroke="#00F0FF" stroke-width="1" />
      <text x="190" y="20" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#67E8F9" text-anchor="middle">JETPACK COMPOSE</text>

      <rect x="265" y="0" width="125" height="30" rx="6" fill="#172554" stroke="#F59E0B" stroke-width="1" />
      <text x="327" y="20" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#FCD34D" text-anchor="middle">FIREBASE SYNC</text>
    </g>
  </g>
</svg>
