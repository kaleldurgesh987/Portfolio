<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#14082B" />
      <stop offset="100%" stop-color="#04020A" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#psBg)" />

  <!-- Cyber Hex Grid Pattern -->
  <g opacity="0.1" stroke="#EC4899" stroke-width="1">
    <circle cx="400" cy="250" r="140" fill="none" />
    <circle cx="400" cy="250" r="220" fill="none" stroke-dasharray="8 8" />
    <circle cx="400" cy="250" r="300" fill="none" />
  </g>

  <!-- Left Side: Sensitive Document with Ephemeral Lock -->
  <g transform="translate(80, 80)">
    <!-- Document Sheet -->
    <rect x="0" y="0" width="220" height="300" rx="12" fill="#0D1124" stroke="rgba(236,72,153,0.4)" stroke-width="2" />
    
    <!-- Top Fold -->
    <polygon points="170,0 220,50 170,50" fill="#1A2244" stroke="rgba(236,72,153,0.4)" stroke-width="1" />
    <polygon points="170,0 220,50 220,0" fill="#080314" />

    <!-- Doc Header -->
    <text x="24" y="44" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#F43F5E">CONFIDENTIAL ID</text>
    <rect x="24" y="60" width="120" height="8" rx="4" fill="#1E293B" />
    <rect x="24" y="78" width="160" height="6" rx="3" fill="#1E293B" />
    <rect x="24" y="94" width="140" height="6" rx="3" fill="#1E293B" />
    
    <!-- Redacted Document Body -->
    <rect x="24" y="116" width="170" height="40" rx="6" fill="#161F38" />
    <text x="34" y="141" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">•••• SHA-256 ENCRYPTED</text>

    <!-- Ephemeral Self-Purge Timer -->
    <g transform="translate(24, 185)">
      <rect x="0" y="0" width="172" height="42" rx="8" fill="#1C102C" stroke="#EC4899" stroke-width="1.5" />
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#F43F5E">⏱ AUTO-PURGE: 02:45</text>
    </g>

    <!-- Dynamic Forensic Watermark -->
    <text x="24" y="270" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">SESSION #88192-MUMBAI-SHOP4</text>
  </g>

  <!-- Central Shield of Data Protection -->
  <g transform="translate(400, 230)" filter="url(#intenseGlow)">
    <!-- Outer Shield Contour -->
    <path d="M 0 -80 C 45 -80, 80 -60, 80 0 C 80 65, 30 100, 0 120 C -30 100, -80 65, -80 0 C -80 -60, -45 -80, 0 -80 Z" fill="rgba(20, 10, 40, 0.85)" stroke="url(#shieldGrad)" stroke-width="3.5" />
    
    <!-- Inner Lock Icon -->
    <rect x="-24" y="-8" width="48" height="42" rx="8" fill="#080314" stroke="#00F0FF" stroke-width="2.5" />
    <path d="M -14 -8 L -14 -24 C -14 -34, 14 -34, 14 -24 L 14 -8" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="12" r="4.5" fill="#A855F7" />
  </g>

  <!-- Right Side: Threat Prevention & Data Protection Points -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="230" height="66" rx="10" fill="#0F172A" stroke="rgba(0,240,255,0.3)" stroke-width="1" />
    <text x="18" y="28" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#00F0FF">NO PERSISTENT CACHE</text>
    <text x="18" y="48" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">Bypasses shop hard drive and RAM.</text>

    <rect x="0" y="85" width="230" height="66" rx="10" fill="#0F172A" stroke="rgba(236,72,153,0.3)" stroke-width="1" />
    <text x="18" y="113" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#EC4899">ONE-TIME PRINT TOKEN</text>
    <text x="18" y="133" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">Invalidated the second paper feeds.</text>

    <rect x="0" y="170" width="230" height="66" rx="10" fill="#0F172A" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
    <text x="18" y="198" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#A855F7">FORENSIC WATERMARKING</text>
    <text x="18" y="218" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">Detects leak origin immediately.</text>

    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="230" height="38" rx="8" fill="#1C102C" stroke="#EC4899" stroke-width="1" />
      <text x="115" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#F472B6" text-anchor="middle">HACKATHON CONCEPT • PRIVACY</text>
    </g>
  </g>
</svg>
